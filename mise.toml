[tools]
node = "24.21.0"
pnpm = "12.10.1"
"github:voidzero-dev/vite-plus" = "1.0.0"
gitleaks = "8.30.1"
hk = { version = "2.4.0", os = ["linux", "windows", "macos/arm64"] }
actionlint = "1.7.12"
shellcheck = "0.11.0"

[env]
HK_CONFIG_DIR = "{{config_root}}/.hk-config"
HK_PKL_BACKEND = false

[tasks."hooks:install"]
run = """
vp config --no-hooks --no-agent
vp hooks disable
hk install --force-local --mise
"""
run_windows = "vp config --no-hooks --no-agent && vp hooks disable && hk install --force-local --mise"
