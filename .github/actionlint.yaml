self-hosted-runner:
  labels:
    - depot-macos-26
    - depot-ubuntu-24.04
    - depot-ubuntu-24.04-4
    - depot-ubuntu-24.04-8
    - depot-ubuntu-24.04-32
    - depot-ubuntu-24.04-arm-16
    - depot-windows-2025-8
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # actionlint 1.7.12 predates create-github-app-token v3's client-id input.
      - 'input "client-id" is not defined in action "actions/create-github-app-token@v3"'
      - 'missing input "app-id" which is required by action "actions/create-github-app-token@v3"'
